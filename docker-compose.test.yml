services:
  mongo-test-replica:
    image: mongo:7.0
    container_name: schoolos-test-replica
    ports:
      - "27018:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}).ok }'"]
      interval: 2s
      timeout: 5s
      retries: 15
